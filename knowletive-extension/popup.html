<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Knowletive Time Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div id="auth-view" class="view">
      <div class="auth-card">
        <div class="auth-badge">⏱</div>
        <h2>Knowletive Tracker</h2>
        <p>Please log in to track your time.</p>
        <form id="login-form">
          <input type="text" id="email" placeholder="Username or Work Email" required autocomplete="username" />
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
          <button type="submit">Sign In</button>
        </form>
        <div id="login-error" class="error hidden" style="margin-top: 10px;"></div>
      </div>
    </div>

    <div id="tracker-view" class="view hidden">
      <div class="header">
        <div class="header-user">
          <div class="header-avatar">K</div>
          <h2 id="user-name">Employee</h2>
        </div>
        <button id="logout-btn" class="text-btn">Sign Out</button>
      </div>
      
      <div class="status-card">
        <p class="status-label">Current Status</p>
        <h1 id="current-status">Not Started</h1>
        <p class="time-elapsed" id="time-elapsed">0h 0m</p>
      </div>

      <div class="actions">
        <button id="start-work-btn" class="btn primary hidden">▶ Start Work</button>
        <button id="start-break-btn" class="btn secondary hidden">☕ Take Break</button>
        <button id="resume-work-btn" class="btn primary hidden">⚡ Resume Work</button>
        <button id="end-work-btn" class="btn danger hidden">⏹ End Workday</button>
      </div>

      <div id="action-error" class="error hidden"></div>

      <div style="margin-top: 4px;">
        <a href="http://localhost:5173" target="_blank" class="btn hub-btn">
          ⏱ Open Web Workspace Hub
        </a>
      </div>
      
      <div class="footer">
        <a href="http://localhost:5173" target="_blank" class="link">Tracker</a>
        <span>•</span>
        <a href="http://localhost:5173/timesheet" target="_blank" class="link">Timesheets</a>
        <span>•</span>
        <a href="http://localhost:5173/analytics" target="_blank" class="link">Analytics</a>
      </div>
      <div class="sync-badge">
        <span id="sync-status">Last synced: Just now</span>
      </div>
    </div>
  </div>
  <script src="dist/popup.js"></script>
</body>
</html>
